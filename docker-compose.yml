# Tribu Paridas - orquestación local de desarrollo
#
#   docker compose up --build
#
#   Frontend           http://localhost:3000
#   Backend            http://localhost:8000
#   API                http://localhost:8000/api/
#   Documentación API  http://localhost:8000/api/docs/
#   Django admin       http://localhost:8000/admin/
#
# Todas las credenciales se leen de ".env" en la raíz (ver .env.example).
name: tribuparidas

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - tribuparidas-net

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD}
      DJANGO_SUPERUSER_FIRST_NAME: ${DJANGO_SUPERUSER_FIRST_NAME}
      DJANGO_SUPERUSER_LAST_NAME: ${DJANGO_SUPERUSER_LAST_NAME}
    volumes:
      - ./backend:/app
      - backend-media:/app/media
      - backend-static:/app/staticfiles
    ports:
      - "8000:8000"
    networks:
      - tribuparidas-net

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE}
      NUXT_API_BASE_SERVER: ${NUXT_API_BASE_SERVER}
      NUXT_PUBLIC_SITE_NAME: ${NUXT_PUBLIC_SITE_NAME}
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    ports:
      - "3000:3000"
    networks:
      - tribuparidas-net

  # Servicio opcional para simular producción (build estático + reverse proxy).
  # No se levanta con "docker compose up" por defecto: docker compose --profile prod up
  nginx:
    image: nginx:1.27-alpine
    profiles: ["prod"]
    depends_on:
      - backend
      - frontend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - backend-media:/media:ro
      - backend-static:/static:ro
    ports:
      - "80:80"
    networks:
      - tribuparidas-net

networks:
  tribuparidas-net:
    driver: bridge

volumes:
  postgres-data:
  backend-media:
  backend-static:
  frontend-node-modules:
