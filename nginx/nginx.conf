# Reverse proxy de referencia para un despliegue de producción.
# Se activa con: docker compose --profile prod up
#
# En producción real, "frontend" debería servir el build generado
# (nuxt build / node .output/server) y "backend" correr con un servidor
# WSGI/ASGI de producción (gunicorn/uvicorn) en vez de runserver.

server {
    listen 80;
    server_name _;

    client_max_body_size 10M;

    location /media/ {
        alias /media/;
    }

    location /static/ {
        alias /static/;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://backend:8000/admin/;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://frontend:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
